<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ranking Padel Jueves</title>
    <style>
      :root {
        --bg: #f4f4f1;
        --surface: #ffffff;
        --ink: #171717;
        --muted: #73706c;
        --line: #e4e1dc;
        --accent: #167a45;
        --gold: #fff1a8;
        --silver: #ededed;
        --bronze: #f4dccb;
        --shadow: 0 18px 45px rgba(17, 17, 17, 0.08);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(22, 122, 69, 0.08), transparent 30rem),
          var(--bg);
      }

      .app {
        width: min(1180px, calc(100% - 32px));
        margin: 24px auto;
      }

      .hero,
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .hero {
        padding: clamp(28px, 4vw, 46px);
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2.6rem, 7vw, 5rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      h2 {
        font-size: clamp(1.75rem, 3vw, 2.5rem);
        line-height: 1;
      }

      .panel {
        margin-top: 24px;
        padding: clamp(22px, 3vw, 34px);
      }

      .subtle {
        margin-top: 8px;
        color: var(--muted);
        font-size: 1.02rem;
      }

      .table-wrap {
        margin-top: 24px;
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 620px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 16px 14px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      th {
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      td {
        font-size: 1.03rem;
        font-weight: 750;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .rank-badge {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--silver);
        font-weight: 900;
      }

      .rank-1 {
        background: var(--gold);
      }

      .rank-3 {
        background: var(--bronze);
      }

      .elo {
        color: var(--accent);
        font-weight: 900;
      }

      @media (max-width: 640px) {
        .app {
          width: min(100% - 20px, 1180px);
          margin: 10px auto 18px;
        }

        .hero,
        .panel {
          padding: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <h1>Ranking Padel ELO</h1>
      </section>

      <section class="panel">
        <h2>Ranking</h2>
        <p class="subtle">Ordenado por ELO actual.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Jugador</th>
                <th>ELO</th>
                <th>PJ</th>
                <th>G</th>
                <th>P</th>
                <th>DIF</th>
              </tr>
            </thead>
            <tbody id="rankingBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const players = [
        { name: "Falipe S", elo: 1000, played: 3, wins: 2, losses: 1, diff: 0 },
        { name: "Tom SJ", elo: 1000, played: 3, wins: 2, losses: 1, diff: 0 },
        { name: "Dani", elo: 1000, played: 3, wins: 2, losses: 1, diff: 0 },
        { name: "Angello", elo: 1000, played: 3, wins: 2, losses: 1, diff: 0 },
        { name: "Joaco", elo: 1000, played: 3, wins: 2, losses: 1, diff: 0 },
        { name: "Fabri", elo: 1000, played: 3, wins: 2, losses: 1, diff: 0 },
        { name: "Fa", elo: 1000, played: 3, wins: 2, losses: 1, diff: 0 },
        { name: "Nebe", elo: 1000, played: 3, wins: 2, losses: 1, diff: 0 },
      ];

      const rows = players
        .map((player, index) => {
          const rankClass = index === 0 ? "rank-1" : index === 2 ? "rank-3" : "";
          return `
            <tr>
              <td><span class="rank-badge ${rankClass}">${index + 1}</span></td>
              <td>${player.name}</td>
              <td class="elo">${player.elo}</td>
              <td>${player.played}</td>
              <td>${player.wins}</td>
              <td>${player.losses}</td>
              <td>${player.diff}</td>
            </tr>
          `;
        })
        .join("");

      document.querySelector("#rankingBody").innerHTML = rows;
    </script>
  </body>
</html>
