<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ranking Padel Jueves</title>
    <style>
      :root {
        --bg: #f4f4f1;
        --surface: #ffffff;
        --ink: #171717;
        --muted: #73706c;
        --line: #e4e1dc;
        --accent: #167a45;
        --gold: #fff1a8;
        --silver: #ededed;
        --bronze: #f4dccb;
        --shadow: 0 18px 45px rgba(17, 17, 17, 0.08);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(22, 122, 69, 0.08), transparent 30rem),
          var(--bg);
      }

      .app {
        width: min(1180px, calc(100% - 32px));
        margin: 24px auto;
      }

      .hero,
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .hero {
        padding: clamp(28px, 4vw, 46px);
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2.6rem, 7vw, 5rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      h2 {
        font-size: clamp(1.75rem, 3vw, 2.5rem);
        line-height: 1;
      }

      .panel {
        margin-top: 24px;
        padding: clamp(22px, 3vw, 34px);
      }

      .subtle {
        margin-top: 8px;
        color: var(--muted);
        font-size: 1.02rem;
      }

      .table-wrap {
        margin-top: 24px;
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 620px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 16px 14px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      th {
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      td {
        font-size: 1.03rem;
        font-weight: 750;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .rank-badge {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--silver);
        font-weight: 900;
      }

      .rank-1 {
        background: var(--gold);
      }

      .rank-3 {
        background: var(--bronze);
      }

      .elo {
        color: var(--accent);
        font-weight: 900;
      }

      @media (max-width: 640px) {
        .app {
          width: min(100% - 20px, 1180px);
          margin: 10px auto 18px;
        }

        .hero,
        .panel {
          padding: 22px;
        }

      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <h1>Ranking Padel ELO</h1>
      </section>

      <section class="panel">
        <h2>Ranking</h2>
        <p class="subtle">Ordenado por ELO actual.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Jugador</th>
                <th>ELO</th>
                <th>PJ</th>
                <th>G</th>
                <th>P</th>
                <th>DIF</th>
              </tr>
            </thead>
            <tbody id="rankingBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2>Historial</h2>
        <p class="subtle">Resultados cargados por fecha.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Pareja A</th>
                <th>Resultado</th>
                <th>Pareja B</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const playerNames = [
        "Cris P.",
        "Joaco",
        "Terre",
        "Fa",
        "Dani",
        "Bindis",
        "Tom SJ",
        "Dieg",
      ];

      const matches = [
        {
          date: "2026-04-30",
          a: ["Cris P.", "Joaco"],
          b: ["Terre", "Fa"],
          scoreA: 6,
          scoreB: 4,
        },
        {
          date: "2026-04-30",
          a: ["Terre", "Fa"],
          b: ["Dani", "Bindis"],
          scoreA: 6,
          scoreB: 3,
        },
        {
          date: "2026-04-30",
          a: ["Terre", "Fa"],
          b: ["Tom SJ", "Dieg"],
          scoreA: 6,
          scoreB: 3,
        },
        {
          date: "2026-04-30",
          a: ["Cris P.", "Joaco"],
          b: ["Dani", "Bindis"],
          scoreA: 6,
          scoreB: 3,
        },
        {
          date: "2026-04-30",
          a: ["Cris P.", "Joaco"],
          b: ["Tom SJ", "Dieg"],
          scoreA: 6,
          scoreB: 4,
        },
        {
          date: "2026-04-30",
          a: ["Dani", "Bindis"],
          b: ["Tom SJ", "Dieg"],
          scoreA: 3,
          scoreB: 6,
        },
      ];

      function calculateRanking() {
        const stats = new Map();
        playerNames.forEach((name) => {
          stats.set(name, {
            name,
            elo: 1000,
            played: 0,
            wins: 0,
            losses: 0,
            diff: 0,
          });
        });

        matches.forEach((match) => {
          applyMatch(stats, match);
        });

        return [...stats.values()].sort((a, b) => {
          if (b.elo !== a.elo) return b.elo - a.elo;
          if (b.wins !== a.wins) return b.wins - a.wins;
          if (b.diff !== a.diff) return b.diff - a.diff;
          return playerNames.indexOf(a.name) - playerNames.indexOf(b.name);
        });
      }

      function applyMatch(stats, match) {
        const eloA = average(match.a.map((name) => stats.get(name).elo));
        const eloB = average(match.b.map((name) => stats.get(name).elo));
        const expectedA = 1 / (1 + Math.pow(10, (eloB - eloA) / 400));
        const actualA = match.scoreA > match.scoreB ? 1 : 0;
        const margin = Math.min(1.35, 1 + Math.abs(match.scoreA - match.scoreB) * 0.035);
        const delta = Math.round(28 * margin * (actualA - expectedA));
        const winner = actualA === 1 ? match.a : match.b;
        const loser = actualA === 1 ? match.b : match.a;

        [...match.a, ...match.b].forEach((name) => {
          stats.get(name).played += 1;
        });

        winner.forEach((name) => {
          const player = stats.get(name);
          player.wins += 1;
          player.elo += Math.abs(delta);
        });

        loser.forEach((name) => {
          const player = stats.get(name);
          player.losses += 1;
          player.elo -= Math.abs(delta);
        });

        match.a.forEach((name) => {
          stats.get(name).diff += match.scoreA - match.scoreB;
        });

        match.b.forEach((name) => {
          stats.get(name).diff += match.scoreB - match.scoreA;
        });
      }

      function average(values) {
        return values.reduce((sum, value) => sum + value, 0) / values.length;
      }

      function formatDate(value) {
        const [year, month, day] = value.split("-");
        return `${day}-${month}-${year}`;
      }

      const rankingRows = calculateRanking()
        .map((player, index) => {
          const rankClass = index === 0 ? "rank-1" : index === 2 ? "rank-3" : "";
          return `
            <tr>
              <td><span class="rank-badge ${rankClass}">${index + 1}</span></td>
              <td>${player.name}</td>
              <td class="elo">${Math.round(player.elo)}</td>
              <td>${player.played}</td>
              <td>${player.wins}</td>
              <td>${player.losses}</td>
              <td>${player.diff > 0 ? "+" : ""}${player.diff}</td>
            </tr>
          `;
        })
        .join("");

      const historyRows = matches
        .map((match) => {
          return `
            <tr>
              <td>${formatDate(match.date)}</td>
              <td>${match.a.join(" / ")}</td>
              <td class="elo">${match.scoreA} - ${match.scoreB}</td>
              <td>${match.b.join(" / ")}</td>
            </tr>
          `;
        })
        .join("");

      document.querySelector("#rankingBody").innerHTML = rankingRows;
      document.querySelector("#historyBody").innerHTML = historyRows;
    </script>
  </body>
</html>
